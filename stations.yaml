# Station positions used in the study. wave_cell_* is the CMEMS wave-model cell that was actually used
# (nearest cell to the requested position); depths come from the GEBCO 2026 grid (15 arc-second).
#   gebco_point_depth_m : depth at the requested position
#   cell_*              : mean / min / max depth inside the +/-0.1 degree box around the wave cell
# depth_plot_m (cell mean) is the depth used on the x-axis of the synthesis figure.
stations:
